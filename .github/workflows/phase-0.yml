name: Linux verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Linux build, tests and smoke check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Restore Go dependencies
        run: go mod download
      - name: Verify foundation, timeline and bakery acceptance offline
        run: sh scripts/check-phase-0.sh
